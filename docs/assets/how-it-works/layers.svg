<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 472" role="img" aria-label="Four layers, and the bottom two cannot be talked past" font-size="13">
  <title>Four layers, and the bottom two cannot be talked past</title>
  <style>svg { --ink: #1f2328; --quiet: #59636e; --edge: #818b98; --grid: #d1d9e0; --accent: #0969da; --tint: rgba(129, 139, 152, 0.12); --paper: #ffffff; }</style>
  <defs>
    <marker id="layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--edge)"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="var(--ink)">Four layers, and the bottom two cannot be talked past</text>
  <g>
    <text x="48" y="68" text-anchor="middle" font-size="11.5" fill="var(--quiet)">Softer</text>
    <path d="M48 80V356" fill="none" stroke="var(--edge)" stroke-width="1.25" marker-end="url(#layers-arrow)"/>
    <text x="48" y="378" text-anchor="middle" font-size="11.5" fill="var(--quiet)">Firmer</text>
  </g>
  <g>
    <rect x="88" y="52" width="648" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="104" y="76" font-weight="600" fill="var(--ink)">1. The command: a written procedure</text>
    <text x="720" y="76" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--quiet)">TOLD</text>
    <text x="104" y="94" font-size="11.5" fill="var(--quiet)">A file of steps that loads when you type the slash command.</text>
    <text x="104" y="110" font-size="11.5" fill="var(--quiet)">Claude follows them in order and stops where the file says stop.</text>
  </g>
  <g>
    <rect x="88" y="140" width="648" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="104" y="164" font-weight="600" fill="var(--ink)">2. Agents with one job each</text>
    <text x="720" y="164" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--quiet)">SECOND AGENT</text>
    <text x="104" y="182" font-size="11.5" fill="var(--quiet)">Separate Claudes that start with a fresh memory and a narrow brief.</text>
    <text x="104" y="198" font-size="11.5" fill="var(--quiet)">One builds. The others only read the result and report what is wrong.</text>
  </g>
  <g>
    <rect x="88" y="228" width="648" height="72" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="104" y="252" font-weight="600" fill="var(--ink)">3. The merge guard: a script on your machine</text>
    <text x="720" y="252" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--ink)">BLOCKED</text>
    <text x="104" y="270" font-size="11.5" fill="var(--quiet)">It sees every shell command before the command runs.</text>
    <text x="104" y="286" font-size="11.5" fill="var(--quiet)">It refuses merges, pushes to main, force pushes and throwing work away.</text>
  </g>
  <g>
    <rect x="88" y="316" width="648" height="72" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="104" y="340" font-weight="600" fill="var(--ink)">4. GitHub rules and checks</text>
    <text x="720" y="340" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--ink)">BLOCKED</text>
    <text x="104" y="358" font-size="11.5" fill="var(--quiet)">No merge without your review record and green tests.</text>
    <text x="104" y="374" font-size="11.5" fill="var(--quiet)">Holds for everyone, admins included, even with Claude switched off.</text>
  </g>
  <g>
    <rect x="88" y="404" width="648" height="44" rx="8" fill="var(--tint)" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="104" y="431" fill="var(--ink)">Under all four: the stack card, glossary, spec and tickets. Every layer reads these.</text>
  </g>
</svg>
