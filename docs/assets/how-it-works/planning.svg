<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 468" role="img" aria-label="One idea becomes ordered tickets, and each ticket is a thin slice" font-size="13">
  <title>One idea becomes ordered tickets, and each ticket is a thin slice</title>
  <style>svg { --ink: #1f2328; --quiet: #59636e; --edge: #818b98; --grid: #d1d9e0; --accent: #0969da; --tint: rgba(129, 139, 152, 0.12); --paper: #ffffff; }</style>
  <defs>
    <marker id="plan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--edge)"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="var(--ink)">One idea becomes ordered tickets, and each ticket is a thin slice</text>
  <g fill="none" stroke="var(--edge)" stroke-width="1.25">
    <path d="M184 88H208" marker-end="url(#plan-arrow)"/>
    <path d="M368 88H392" marker-end="url(#plan-arrow)"/>
    <path d="M552 88H576" marker-end="url(#plan-arrow)"/>
    <path d="M656 124V148H124V172" marker-end="url(#plan-arrow)"/>
    <path d="M224 208H256" marker-end="url(#plan-arrow)"/>
    <path d="M480 208H512" marker-end="url(#plan-arrow)"/>
    <path d="M368 244V264H256V288" marker-end="url(#plan-arrow)"/>
  </g>
  <text x="390" y="142" text-anchor="middle" font-size="11.5" fill="var(--quiet)">the tickets are built in this order</text>
  <g>
    <rect x="24" y="52" width="160" height="72" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="36" y="76" font-weight="600" fill="var(--ink)">Your idea</text>
    <text x="36" y="94" font-size="11.5" fill="var(--quiet)">One sentence is</text>
    <text x="36" y="110" font-size="11.5" fill="var(--quiet)">enough to start</text>
  </g>
  <g>
    <rect x="208" y="52" width="160" height="72" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="220" y="76" font-weight="600" fill="var(--ink)">/grill-with-docs</text>
    <text x="220" y="94" font-size="11.5" fill="var(--quiet)">Questions in rounds</text>
    <text x="220" y="110" font-size="11.5" fill="var(--quiet)">until nothing is open</text>
  </g>
  <g>
    <rect x="392" y="52" width="160" height="72" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="404" y="76" font-weight="600" fill="var(--ink)">/to-spec</text>
    <text x="404" y="94" font-size="11.5" fill="var(--quiet)">One spec issue with</text>
    <text x="404" y="110" font-size="11.5" fill="var(--quiet)">stories and decisions</text>
  </g>
  <g>
    <rect x="576" y="52" width="160" height="72" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="588" y="76" font-weight="600" fill="var(--ink)">/to-tickets</text>
    <text x="588" y="94" font-size="11.5" fill="var(--quiet)">The spec cut into</text>
    <text x="588" y="110" font-size="11.5" fill="var(--quiet)">small ordered pieces</text>
  </g>
  <g>
    <rect x="24" y="172" width="200" height="72" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="40" y="196" font-weight="600" fill="var(--ink)">#41 Prefactor</text>
    <text x="40" y="214" font-size="11.5" fill="var(--quiet)">Reshape the old code first,</text>
    <text x="40" y="230" font-size="11.5" fill="var(--quiet)">so the change becomes easy</text>
  </g>
  <g>
    <rect x="256" y="172" width="224" height="72" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="272" y="196" font-weight="600" fill="var(--ink)">#42 The first thin slice</text>
    <text x="272" y="214" font-size="11.5" fill="var(--quiet)">One narrow working path</text>
    <text x="272" y="230" font-size="11.5" fill="var(--quiet)">through every layer</text>
  </g>
  <g>
    <rect x="524" y="164" width="212" height="72" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <rect x="518" y="168" width="212" height="72" rx="8" fill="var(--paper)" stroke="var(--edge)" stroke-width="1.25"/>
    <rect x="512" y="172" width="212" height="72" rx="8" fill="var(--paper)" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="528" y="196" font-weight="600" fill="var(--ink)">#43, #44, #45</text>
    <text x="528" y="214" font-size="11.5" fill="var(--quiet)">The rest, side by side,</text>
    <text x="528" y="230" font-size="11.5" fill="var(--quiet)">once #42 is merged</text>
  </g>
  <g>
    <rect x="24" y="296" width="400" height="36" rx="6" fill="var(--tint)" stroke="var(--edge)" stroke-width="1.25"/>
    <rect x="24" y="336" width="400" height="36" rx="6" fill="var(--tint)" stroke="var(--edge)" stroke-width="1.25"/>
    <rect x="24" y="376" width="400" height="36" rx="6" fill="var(--tint)" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="40" y="318" font-size="11.5" font-weight="600" fill="var(--ink)">Screen</text>
    <text x="40" y="358" font-size="11.5" font-weight="600" fill="var(--ink)">API</text>
    <text x="40" y="398" font-size="11.5" font-weight="600" fill="var(--ink)">Database</text>
  </g>
  <g>
    <rect x="232" y="288" width="48" height="132" rx="6" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="2"/>
    <text x="256" y="440" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">#42</text>
  </g>
  <g>
    <rect x="296" y="288" width="48" height="132" rx="6" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <rect x="360" y="288" width="48" height="132" rx="6" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="320" y="440" text-anchor="middle" font-size="11.5" fill="var(--quiet)">#43</text>
    <text x="384" y="440" text-anchor="middle" font-size="11.5" fill="var(--quiet)">#44</text>
  </g>
  <g>
    <text x="456" y="324" font-weight="600" fill="var(--ink)">A slice cuts through every layer,</text>
    <text x="456" y="342" font-weight="600" fill="var(--ink)">so it works and can be shown alone.</text>
    <text x="456" y="372" font-size="11.5" fill="var(--quiet)">Building one whole layer at a time</text>
    <text x="456" y="388" font-size="11.5" fill="var(--quiet)">proves nothing until the very end.</text>
  </g>
</svg>
