<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 416" role="img" aria-label="Every test run gets its own app and database, then removes them" font-size="13">
  <title>Every test run gets its own app and database, then removes them</title>
  <style>svg { --ink: #1f2328; --quiet: #59636e; --edge: #818b98; --grid: #d1d9e0; --accent: #0969da; --tint: rgba(129, 139, 152, 0.12); --paper: #ffffff; }</style>
  <defs>
    <marker id="e2e-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--edge)"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="var(--ink)">Every test run gets its own app and database, then removes them</text>
  <g fill="none" stroke="var(--edge)" stroke-width="1.25">
    <path d="M280 128H432" marker-end="url(#e2e-arrow)"/>
    <path d="M280 240H356V148H432" marker-end="url(#e2e-arrow)"/>
  </g>
  <text x="356" y="120" text-anchor="middle" font-size="11.5" fill="var(--quiet)">API calls and clicks</text>
  <text x="318" y="232" text-anchor="middle" font-size="11.5" fill="var(--quiet)">explores</text>
  <g>
    <rect x="24" y="92" width="256" height="88" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="40" y="116" font-weight="600" fill="var(--ink)">Playwright tests</text>
    <text x="40" y="132" font-size="11.5" fill="var(--quiet)">Call the API and click the screen</text>
    <text x="40" y="148" font-size="11.5" fill="var(--quiet)">as a user would. Expected values</text>
    <text x="40" y="164" font-size="11.5" fill="var(--quiet)">come from an oracle, not the app</text>
  </g>
  <g>
    <rect x="24" y="204" width="256" height="72" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="40" y="228" font-weight="600" fill="var(--ink)">Claude browser tool</text>
    <text x="268" y="228" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--quiet)">MCP</text>
    <text x="40" y="244" font-size="11.5" fill="var(--quiet)">For exploring a screen by hand.</text>
    <text x="40" y="260" font-size="11.5" fill="var(--quiet)">It may open local pages only</text>
  </g>
  <g>
    <rect x="416" y="52" width="320" height="272" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="432" y="76" font-weight="600" fill="var(--ink)">Throwaway containers, private network</text>
    <rect x="432" y="92" width="288" height="72" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="none"/>
    <rect x="432" y="180" width="288" height="56" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="none"/>
    <rect x="432" y="252" width="288" height="56" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="444" y="116" font-weight="600" fill="var(--ink)">Your app</text>
    <text x="444" y="132" font-size="11.5" fill="var(--quiet)">Built from the project Dockerfile</text>
    <text x="444" y="148" font-size="11.5" fill="var(--quiet)">and reached on a random port</text>
    <text x="444" y="204" font-weight="600" fill="var(--ink)">Postgres</text>
    <text x="444" y="220" font-size="11.5" fill="var(--quiet)">A fresh database for every run</text>
    <text x="444" y="276" font-weight="600" fill="var(--ink)">Kafka, Redis, a web front end</text>
    <text x="444" y="292" font-size="11.5" fill="var(--quiet)">Off until you switch them on</text>
  </g>
  <g>
    <rect x="24" y="348" width="712" height="44" rx="8" fill="var(--tint)" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="40" y="375" fill="var(--ink)">After the run every container is removed, even when the run crashed.</text>
  </g>
</svg>
