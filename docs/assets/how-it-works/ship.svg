<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 640" role="img" aria-label="You say yes three times before a change reaches production" font-size="13">
  <title>You say yes three times before a change reaches production</title>
  <style>svg { --ink: #1f2328; --quiet: #59636e; --edge: #818b98; --grid: #d1d9e0; --accent: #0969da; --tint: rgba(129, 139, 152, 0.12); --paper: #ffffff; }</style>
  <defs>
    <marker id="ship-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--edge)"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="var(--ink)">You say yes three times before a change reaches production</text>
  <g>
    <rect x="24" y="44" width="14" height="14" rx="3" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="46" y="56" font-size="11.5" fill="var(--quiet)">You say yes</text>
    <rect x="150" y="44" width="14" height="14" rx="3" fill="var(--tint)" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="172" y="56" font-size="11.5" fill="var(--quiet)">GitHub works alone</text>
    <rect x="312" y="44" width="14" height="14" rx="3" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="334" y="56" font-size="11.5" fill="var(--quiet)">What happens otherwise</text>
  </g>
  <g fill="none" stroke="var(--edge)" stroke-width="1.25">
    <path d="M224 136V160" marker-end="url(#ship-arrow)"/>
    <path d="M224 216V240" marker-end="url(#ship-arrow)"/>
    <path d="M224 296V320" marker-end="url(#ship-arrow)"/>
    <path d="M224 376V400" marker-end="url(#ship-arrow)"/>
    <path d="M224 456V480" marker-end="url(#ship-arrow)"/>
    <path d="M224 536V560" marker-end="url(#ship-arrow)"/>
  </g>
  <g>
    <rect x="24" y="80" width="400" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="40" y="104" font-weight="600" fill="var(--ink)">A small pull request</text>
    <text x="408" y="104" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--quiet)">FROM /implement</text>
    <text x="40" y="122" font-size="11.5" fill="var(--quiet)">Tested, and already reviewed by agents</text>
  </g>
  <g>
    <rect x="24" y="160" width="400" height="56" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <g>
      <path d="M424 188H472" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
      <rect x="472" y="160" width="264" height="56" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    </g>
    <text x="40" y="184" font-weight="600" fill="var(--ink)">/human-review #57</text>
    <text x="408" y="184" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--ink)">YES 1</text>
    <text x="40" y="202" font-size="11.5" fill="var(--quiet)">You answer questions about the change</text>
    <text x="488" y="184" font-weight="600" fill="var(--ink)">Record missing or out of date?</text>
    <text x="488" y="202" font-size="11.5" fill="var(--quiet)">The check is red and Merge is locked</text>
  </g>
  <g>
    <rect x="24" y="240" width="400" height="56" rx="8" fill="var(--tint)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <g>
      <path d="M424 268H472" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
      <rect x="472" y="240" width="264" height="56" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    </g>
    <text x="40" y="264" font-weight="600" fill="var(--ink)">Checks on GitHub</text>
    <text x="40" y="282" font-size="11.5" fill="var(--quiet)">The tests run again, away from your machine</text>
    <text x="488" y="264" font-weight="600" fill="var(--ink)">A test is red?</text>
    <text x="488" y="282" font-size="11.5" fill="var(--quiet)">Merge stays locked for everyone</text>
  </g>
  <g>
    <rect x="24" y="320" width="400" height="56" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <g>
      <path d="M424 348H472" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
      <rect x="472" y="320" width="264" height="56" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    </g>
    <text x="40" y="344" font-weight="600" fill="var(--ink)">Press Merge</text>
    <text x="408" y="344" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--ink)">YES 2</text>
    <text x="40" y="362" font-size="11.5" fill="var(--quiet)">A person decides what reaches main</text>
    <text x="488" y="344" font-weight="600" fill="var(--ink)">Claude tries to merge?</text>
    <text x="488" y="362" font-size="11.5" fill="var(--quiet)">The merge guard refuses the command</text>
  </g>
  <g>
    <rect x="24" y="400" width="400" height="56" rx="8" fill="var(--tint)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <g>
      <path d="M424 428H472" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
      <rect x="472" y="400" width="264" height="56" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    </g>
    <text x="40" y="424" font-weight="600" fill="var(--ink)">Build, then staging</text>
    <text x="40" y="442" font-size="11.5" fill="var(--quiet)">One image for this exact commit, tried on staging first</text>
    <text x="488" y="424" font-weight="600" fill="var(--ink)">The rollout fails?</text>
    <text x="488" y="442" font-size="11.5" fill="var(--quiet)">It is undone by itself</text>
  </g>
  <g>
    <rect x="24" y="480" width="400" height="56" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <g>
      <path d="M424 508H472" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
      <rect x="472" y="480" width="264" height="56" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    </g>
    <text x="40" y="504" font-weight="600" fill="var(--ink)">Approve production</text>
    <text x="408" y="504" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--ink)">YES 3</text>
    <text x="40" y="522" font-size="11.5" fill="var(--quiet)">One click in GitHub, when staging looks right</text>
    <text x="488" y="504" font-weight="600" fill="var(--ink)">You have not approved?</text>
    <text x="488" y="522" font-size="11.5" fill="var(--quiet)">Production is not touched</text>
  </g>
  <g>
    <rect x="24" y="560" width="400" height="56" rx="8" fill="var(--tint)" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <g>
      <path d="M424 588H472" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
      <rect x="472" y="560" width="264" height="56" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    </g>
    <text x="40" y="584" font-weight="600" fill="var(--ink)">Production</text>
    <text x="40" y="602" font-size="11.5" fill="var(--quiet)">The old version keeps serving until the new one is ready</text>
    <text x="488" y="584" font-weight="600" fill="var(--ink)">Rollout or smoke test fails?</text>
    <text x="488" y="602" font-size="11.5" fill="var(--quiet)">Undone by itself, old version serves</text>
  </g>
</svg>
