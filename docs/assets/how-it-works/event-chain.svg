<svg xmlns="http://www.w3.org/2000/svg" width="760" height="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 192" role="img" aria-label="One event sets off a rule, and the rule sets off the next command" font-size="13">
  <title>One event sets off a rule, and the rule sets off the next command</title>
  <style>svg { --ink: #1f2328; --quiet: #59636e; --edge: #818b98; --grid: #d1d9e0; --accent: #0969da; --tint: rgba(129, 139, 152, 0.12); --paper: #ffffff; }</style>
  <defs>
    <marker id="storm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--edge)"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="var(--ink)">One event sets off a rule, and the rule sets off the next command</text>
  <g fill="none" stroke="var(--edge)" stroke-width="1.25">
    <path d="M152 96H170" marker-end="url(#storm-arrow)"/>
    <path d="M298 96H316" marker-end="url(#storm-arrow)"/>
    <path d="M444 96H462" marker-end="url(#storm-arrow)"/>
    <path d="M590 96H608" marker-end="url(#storm-arrow)"/>
  </g>
  <g>
    <rect x="24" y="52" width="128" height="88" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="36" y="74" font-size="10.5" font-weight="600" fill="var(--quiet)">EVENT</text>
    <text x="36" y="94" font-weight="600" fill="var(--ink)">Copy returned</text>
    <text x="36" y="110" font-size="11.5" fill="var(--quiet)">A fact, in the</text>
    <text x="36" y="126" font-size="11.5" fill="var(--quiet)">past tense</text>
  </g>
  <g>
    <rect x="170" y="52" width="128" height="88" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="182" y="74" font-size="10.5" font-weight="600" fill="var(--quiet)">RULE</text>
    <text x="182" y="94" font-weight="600" fill="var(--ink)">Set it aside</text>
    <text x="182" y="110" font-size="11.5" fill="var(--quiet)">for the next</text>
    <text x="182" y="126" font-size="11.5" fill="var(--quiet)">reservation</text>
  </g>
  <g>
    <rect x="316" y="52" width="128" height="88" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="328" y="74" font-size="10.5" font-weight="600" fill="var(--quiet)">COMMAND</text>
    <text x="328" y="94" font-weight="600" fill="var(--ink)">SetAsideCopy</text>
    <text x="328" y="110" font-size="11.5" fill="var(--quiet)">A request that</text>
    <text x="328" y="126" font-size="11.5" fill="var(--quiet)">can be refused</text>
  </g>
  <g>
    <rect x="462" y="52" width="128" height="88" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="474" y="74" font-size="10.5" font-weight="600" fill="var(--quiet)">EVENT</text>
    <text x="474" y="94" font-weight="600" fill="var(--ink)">Copy set aside</text>
    <text x="474" y="110" font-size="11.5" fill="var(--quiet)">The next fact</text>
  </g>
  <g>
    <rect x="608" y="52" width="128" height="88" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="620" y="74" font-size="10.5" font-weight="600" fill="var(--quiet)">RULE</text>
    <text x="620" y="94" font-weight="600" fill="var(--ink)">Notify member</text>
    <text x="620" y="110" font-size="11.5" fill="var(--quiet)">The next rule</text>
    <text x="620" y="126" font-size="11.5" fill="var(--quiet)">in the chain</text>
  </g>
  <text x="24" y="168" font-size="11.5" fill="var(--quiet)">The library example: a returned copy is set aside for the member who reserved the title.</text>
