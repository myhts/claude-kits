<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 472" role="img" aria-label="Only two of the eight agents may change files" font-size="13">
  <title>Only two of the eight agents may change files</title>
  <style>svg { --ink: #1f2328; --quiet: #59636e; --edge: #818b98; --grid: #d1d9e0; --accent: #0969da; --tint: rgba(129, 139, 152, 0.12); --paper: #ffffff; }</style>
  <text x="24" y="30" font-size="15" font-weight="600" fill="var(--ink)">Only two of the eight agents may change files</text>
  <g>
    <rect x="24" y="44" width="14" height="14" rx="3" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="46" y="56" font-size="11.5" fill="var(--quiet)">May change files</text>
    <rect x="170" y="44" width="14" height="14" rx="3" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="192" y="56" font-size="11.5" fill="var(--quiet)">Reads and reports only</text>
  </g>
  <g>
    <rect x="24" y="80" width="224" height="128" rx="8" fill="var(--tint)" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="40" y="104" font-weight="600" fill="var(--ink)">Explains</text>
    <rect x="40" y="120" width="192" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="52" y="144" font-weight="600" fill="var(--ink)">mentor</text>
    <text x="52" y="160" font-size="11.5" fill="var(--quiet)">Teaches with your own code.</text>
    <text x="52" y="176" font-size="11.5" fill="var(--quiet)">Hints, smallest first</text>
  </g>
  <g>
    <rect x="264" y="80" width="472" height="128" rx="8" fill="var(--tint)" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="280" y="104" font-weight="600" fill="var(--ink)">Builds</text>
    <text x="720" y="104" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--quiet)">ONLY WHEN HANDED THE WORK</text>
    <rect x="280" y="120" width="212" height="72" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <rect x="508" y="120" width="212" height="72" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="292" y="144" font-weight="600" fill="var(--ink)">implementer</text>
    <text x="292" y="160" font-size="11.5" fill="var(--quiet)">Builds test-first what it is</text>
    <text x="292" y="176" font-size="11.5" fill="var(--quiet)">handed. Asks before deleting</text>
    <text x="520" y="144" font-weight="600" fill="var(--ink)">e2e-tester</text>
    <text x="708" y="144" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--quiet)">e2e ADD-ON</text>
    <text x="520" y="160" font-size="11.5" fill="var(--quiet)">Writes end-to-end tests.</text>
    <text x="520" y="176" font-size="11.5" fill="var(--quiet)">Changes only the e2e folder</text>
  </g>
  <g>
    <rect x="24" y="232" width="712" height="216" rx="8" fill="var(--tint)" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="40" y="256" font-weight="600" fill="var(--ink)">Only checks</text>
    <text x="720" y="256" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--quiet)">NO TOOL FOR EDITING FILES</text>
    <rect x="40" y="272" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <rect x="272" y="272" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <rect x="504" y="272" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <rect x="40" y="360" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <rect x="272" y="360" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="52" y="296" font-weight="600" fill="var(--ink)">code-reviewer</text>
    <text x="52" y="312" font-size="11.5" fill="var(--quiet)">Knows your rules, glossary</text>
    <text x="52" y="328" font-size="11.5" fill="var(--quiet)">and the ticket</text>
    <text x="284" y="296" font-weight="600" fill="var(--ink)">blind-reviewer</text>
    <text x="284" y="312" font-size="11.5" fill="var(--quiet)">Sees only the code. Checks it</text>
    <text x="284" y="328" font-size="11.5" fill="var(--quiet)">against published practice</text>
    <text x="516" y="296" font-weight="600" fill="var(--ink)">deploy-reviewer</text>
    <text x="516" y="312" font-size="11.5" fill="var(--quiet)">Dockerfile, CI and Kubernetes:</text>
    <text x="516" y="328" font-size="11.5" fill="var(--quiet)">how they behave when running</text>
    <text x="52" y="384" font-weight="600" fill="var(--ink)">security-reviewer</text>
    <text x="52" y="400" font-size="11.5" fill="var(--quiet)">Looks for ways to attack</text>
    <text x="52" y="416" font-size="11.5" fill="var(--quiet)">the app, in any language</text>
    <text x="284" y="384" font-weight="600" fill="var(--ink)">spring-security-reviewer</text>
    <text x="284" y="400" font-size="11.5" fill="var(--quiet)">The same, with knowledge</text>
    <text x="284" y="416" font-size="11.5" fill="var(--quiet)">of Spring Boot</text>
    <text x="516" y="392" font-size="11.5" fill="var(--quiet)">Each starts with a fresh memory</text>
    <text x="516" y="408" font-size="11.5" fill="var(--quiet)">and reports back to your session</text>
  </g>
</svg>
