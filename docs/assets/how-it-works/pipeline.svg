<svg xmlns="http://www.w3.org/2000/svg" width="760" height="964" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 964" role="img" aria-label="Each step leaves a record, and the blue steps wait for you" font-size="13">
  <title>Each step leaves a record, and the blue steps wait for you</title>
  <style>svg { --ink: #1f2328; --quiet: #59636e; --edge: #818b98; --grid: #d1d9e0; --accent: #0969da; --tint: rgba(129, 139, 152, 0.12); --paper: #ffffff; }</style>
