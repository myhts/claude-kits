<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 460" role="img" aria-label="Skills load into your session; the other three sit outside it" font-size="13">
  <title>Skills load into your session; the other three sit outside it</title>
  <style>svg { --ink: #1f2328; --quiet: #59636e; --edge: #818b98; --grid: #d1d9e0; --accent: #0969da; --tint: rgba(129, 139, 152, 0.12); --paper: #ffffff; }</style>
  <defs>
    <marker id="kinds-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--edge)"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" fill="var(--ink)">Skills load into your session; the other three sit outside it</text>
  <g>
    <rect x="24" y="44" width="14" height="14" rx="3" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="46" y="56" font-size="11.5" fill="var(--quiet)">The only kind that can refuse Claude</text>
  </g>
  <g fill="none" stroke="var(--edge)" stroke-width="1.25">
    <path d="M304 132H456" marker-start="url(#kinds-arrow)" marker-end="url(#kinds-arrow)"/>
    <path d="M304 228H456" marker-end="url(#kinds-arrow)"/>
    <path d="M304 324H456" marker-end="url(#kinds-arrow)"/>
  </g>
  <text x="380" y="124" text-anchor="middle" font-size="11.5" fill="var(--quiet)">task out, report back</text>
  <text x="380" y="220" text-anchor="middle" font-size="11.5" fill="var(--quiet)">every shell command</text>
  <text x="380" y="316" text-anchor="middle" font-size="11.5" fill="var(--quiet)">uses the tool</text>
  <g>
    <rect x="24" y="80" width="280" height="288" rx="8" fill="var(--tint)" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="40" y="104" font-weight="600" fill="var(--ink)">Your Claude session</text>
    <rect x="40" y="120" width="248" height="72" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <rect x="40" y="208" width="248" height="56" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <rect x="40" y="280" width="248" height="72" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="52" y="144" font-weight="600" fill="var(--ink)">Your conversation</text>
    <text x="52" y="160" font-size="11.5" fill="var(--quiet)">What you typed and what Claude</text>
    <text x="52" y="176" font-size="11.5" fill="var(--quiet)">answered. An agent never sees it</text>
    <text x="52" y="232" font-weight="600" fill="var(--ink)">CLAUDE.md</text>
    <text x="52" y="248" font-size="11.5" fill="var(--quiet)">Read at the start of every session</text>
    <text x="52" y="304" font-weight="600" fill="var(--ink)">Skills</text>
    <text x="276" y="304" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--quiet)">TOLD</text>
    <text x="52" y="320" font-size="11.5" fill="var(--quiet)">Written steps and knowledge.</text>
    <text x="52" y="336" font-size="11.5" fill="var(--quiet)">Loaded by your command, or by topic</text>
  </g>
  <g>
    <rect x="456" y="96" width="280" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="472" y="120" font-weight="600" fill="var(--ink)">Agent</text>
    <text x="720" y="120" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--quiet)">SECOND AGENT</text>
    <text x="472" y="136" font-size="11.5" fill="var(--quiet)">A separate Claude with a fresh memory</text>
    <text x="472" y="152" font-size="11.5" fill="var(--quiet)">and its own tools. It reports back</text>
  </g>
  <g>
    <rect x="456" y="192" width="280" height="72" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/>
    <text x="472" y="216" font-weight="600" fill="var(--ink)">Hook: the merge guard</text>
    <text x="720" y="216" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--ink)">BLOCKED</text>
    <text x="472" y="232" font-size="11.5" fill="var(--quiet)">A script that reads each shell command</text>
    <text x="472" y="248" font-size="11.5" fill="var(--quiet)">before it runs, and can refuse it</text>
  </g>
  <g>
    <rect x="456" y="288" width="280" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/>
    <text x="472" y="312" font-weight="600" fill="var(--ink)">MCP server: a browser</text>
    <text x="720" y="312" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--quiet)">ALLOW-LIST</text>
    <text x="472" y="328" font-size="11.5" fill="var(--quiet)">A program that lends Claude a tool.</text>
    <text x="472" y="344" font-size="11.5" fill="var(--quiet)">Kept to pages on your own machine</text>
  </g>
  <g>
    <rect x="24" y="392" width="712" height="44" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="40" y="419" fill="var(--ink)">Skills and agents load when a session starts, so restart claude after installing one.</text>
  </g>
</svg>
