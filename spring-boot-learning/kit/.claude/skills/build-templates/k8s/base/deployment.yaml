# The app. Secrets are NOT in this repo: the deploy workflow writes them from GitHub Environment secrets, or create
# them out of band, e.g.
#   kubectl create secret generic app-secrets --from-env-file=prod.env     (prod.env never committed)
# or use External Secrets / Sealed Secrets. This file only references the Secret by name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: { app.kubernetes.io/name: app }
spec:
  replicas: 2                                    # the overlays set this per environment
  selector:
    matchLabels: { app.kubernetes.io/name: app }
  # Old pods keep serving until a new one is ready (maxUnavailable: 0), so a bad version never takes traffic and a
  # rollout that fails readiness just stalls; `kubectl rollout undo` then removes the new pods.
  # Flyway migrates at startup, so old and new versions share one schema during the rollout and after a rollback
  # (the old version still starts: Flyway ignores newer, "future" migrations by default). So migrations must be
  # expand/contract: add a column → deploy code that uses it → drop the old one in a later release. Never rename
  # or drop something the running version still reads.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: app }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45          # > preStop (10s) + shutdown phase (20s) + margin
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: registry.example.com/app:1.0.0   # placeholder: kustomization.yaml's images: sets the registry and
                                                  # the overlays the tag (a commit SHA, never :latest)
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { memory: 768Mi }              # memory request = limit for the JVM; no CPU limit (throttling)
          startupProbe:                            # slow start: liveness waits until this passes
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:                           # restart only if the app itself is stuck: no DB checks here
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:                          # stop sending traffic when it can't serve (DB down, shutting down)
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:                               # let endpoints/load balancers drop the pod before it stops
              sleep: { seconds: 10 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }        # writable /tmp with a read-only root filesystem
      volumes:
        - name: tmp
          emptyDir: {}
