# The app. Secrets are NOT in this repo: create them out of band, e.g.
#   kubectl create secret generic app-secrets --from-env-file=prod.env     (prod.env never committed)
# or use External Secrets / Sealed Secrets. This file only references the Secret by name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: { app.kubernetes.io/name: app }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: app }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: app }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45          # > preStop (10s) + shutdown phase (20s) + margin
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: registry.example.com/app:1.0.0   # a pinned tag or digest, never :latest
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { memory: 768Mi }              # memory request = limit for the JVM; no CPU limit (throttling)
          startupProbe:                            # slow start: liveness waits until this passes
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:                           # restart only if the app itself is stuck: no DB checks here
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:                          # stop sending traffic when it can't serve (DB down, shutting down)
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:                               # let endpoints/load balancers drop the pod before it stops
              sleep: { seconds: 10 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }        # writable /tmp with a read-only root filesystem
      volumes:
        - name: tmp
          emptyDir: {}
